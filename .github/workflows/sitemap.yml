name: Generate Sitemap
on:
  push:
    branches:
      - main
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://petagecalc.in/
          exclude-paths: /yandex_2fe67b41e9739055.html /blog/article-template.html /templates/blog-post-template.html
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update sitemap.xml"
          file_pattern: sitemap.xml
