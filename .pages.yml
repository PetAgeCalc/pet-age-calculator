media: media
content:
  - name: posts
    label: "New Articles"
    type: collection
    path: content/posts
    format: json
    view:
      fields: [title, tag, date]
    fields:
      - name: title
        label: "Article Title"
        type: string
        required: true

      - name: thumbnail
        label: "Thumbnail Image"
        type: image
        required: false

      - name: tag
        label: "Category Tag"
        type: string
        description: 'Chhota label jaise "Dog Care", "Pet Care"'

      - name: date
        label: "Publish Date"
        type: string
        description: 'Jaise "August 2026"'

      - name: read_time
        label: "Read Time"
        type: string
        description: 'Jaise "8 min read"'

      - name: description
        label: "Meta Description (SEO)"
        type: text

      - name: keywords
        label: "Meta Keywords (SEO, comma separated)"
        type: text

      - name: content
        label: "Article Content"
        type: rich-text
        required: true
        description: "WordPress jaisa editor — likhte jao, H2 chahiye to heading button dabao, image chahiye to image button dabakar upload karo."
        options:
          path: images/blog-content
          extensions: [jpg, jpeg, png, webp]

  - name: legacy_posts
    label: "Old Articles (raw HTML)"
    type: collection
    path: blog
    filter:
      extension: html
    fields:
      - name: body
        label: "Raw HTML"
        type: code
        options:
          language: html
